[project]
name = "reactor-backend"
version = "0.1.0"
description = "Python backend for the reactor simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "fmpy>=0.3.22",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[tool.uv]
package = false


[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]
